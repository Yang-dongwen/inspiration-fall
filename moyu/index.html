<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>摸鱼消消</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#0d1117;color:#e6edf3;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;user-select:none;-webkit-user-select:none}
h1{font-size:1.15rem;color:#f0c14b;letter-spacing:.06em}
#wrap{width:min(420px,96vw);display:flex;flex-direction:column;gap:10px}
.top{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;gap:6px 8px;padding:10px 12px;background:#161b22;border:1px solid #30363d;border-radius:10px;font-size:.85rem;color:#8b949e}
.top .lv{justify-self:start}
.top .moves{justify-self:center;font-size:1.05rem}
.top .moves strong{font-size:1.25rem;color:#e6edf3}
.top .spacer{justify-self:end;opacity:0}
.top .goal{grid-column:1/-1;color:#f0c14b;font-size:.82rem;text-align:center;line-height:1.35}
.top strong{color:#e6edf3;font-weight:600}
#board-wrap{position:relative}
#board{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;aspect-ratio:1;padding:8px;background:#161b22;border:1px solid #30363d;border-radius:10px;touch-action:none;position:relative}
.cell{position:relative;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:transparent;overflow:visible;aspect-ratio:1;z-index:1}
.cell img{width:100%;height:100%;object-fit:contain;pointer-events:none;display:block;transition:transform .12s}
.cell.selected{z-index:3}
.cell.selected img{box-shadow:0 0 0 2px #f0c14b,0 0 12px rgba(240,193,75,.35);border-radius:10px;transform:scale(1.06)}
.cell.disabled{pointer-events:none}
.cell.popping img{animation:popClear .32s ease-out forwards}
@keyframes popClear{
  0%{transform:scale(1);opacity:1;filter:brightness(1)}
  40%{transform:scale(1.25);opacity:1;filter:brightness(1.4)}
  100%{transform:scale(0);opacity:0;filter:brightness(2)}
}
.cell.falling img{transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.cell.spawn img{animation:spawnIn .28s ease-out}
@keyframes spawnIn{
  from{transform:translateY(-120%) scale(.85);opacity:0}
  to{transform:translateY(0) scale(1);opacity:1}
}
.cell.swap-a,.cell.swap-b{z-index:4;transition:transform .18s ease}
.fx-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:10px;z-index:10}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;background:#f0c14b;opacity:.9;animation:sparkFly .4s ease-out forwards}
@keyframes sparkFly{
  to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}
}
.float-score{position:absolute;color:#f0c14b;font-weight:700;font-size:14px;text-shadow:0 1px 4px #000;animation:floatUp .7s ease-out forwards;pointer-events:none;z-index:12}
@keyframes floatUp{
  from{transform:translate(-50%,0);opacity:1}
  to{transform:translate(-50%,-36px);opacity:0}
}
.bottom{display:flex;gap:10px}
.btn{flex:1;padding:14px 8px;border-radius:10px;border:1px solid #30363d;background:#21262d;color:#c9d1d9;font-size:.85rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn img{width:40px;height:40px;border-radius:8px;flex-shrink:0}
.btn .btn-text{text-align:left;line-height:1.2}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn em{display:block;font-style:normal;color:#8b949e;font-size:.75rem;margin-top:2px}
.overlay{position:fixed;inset:0;background:rgba(13,17,23,.82);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.overlay.show{display:flex}
.card{background:#161b22;border:1px solid #30363d;border-radius:14px;padding:28px 24px;text-align:center;max-width:320px;width:100%}
.card h2{font-size:1.5rem;margin-bottom:8px}
.card.win h2{color:#3fb950}
.card.lose h2{color:#f85149}
.card p{color:#8b949e;margin-bottom:18px;line-height:1.5}
.card button{padding:10px 20px;margin:4px;border-radius:8px;border:none;background:#f0c14b;color:#0d1117;font-weight:700;cursor:pointer}
.card button.ghost{background:transparent;border:1px solid #30363d;color:#c9d1d9}
.hint{font-size:.75rem;color:#6e7681;text-align:center}
</style>
</head>
<body>
<h1>摸鱼消消</h1>
<div id="wrap">
  <div class="top">
    <span class="lv">关卡 <strong id="lv">1</strong>/30</span>
    <span class="moves">步数 <strong id="moves">20</strong></span>
    <span class="spacer">·</span>
    <span class="goal" id="goal">—</span>
  </div>
  <div id="board-wrap">
    <div id="board"></div>
    <div class="fx-layer" id="fx"></div>
  </div>
  <div class="bottom">
    <button class="btn" id="btnShuffle" type="button"><img src="assets/prop-shuffle-128.png" alt=""><span class="btn-text">打乱<em>本关 1 次</em></span></button>
    <button class="btn" id="btnClearRow" type="button"><img src="assets/prop-clear-row-128.png" alt=""><span class="btn-text">消一行<em>本关 1 次</em></span></button>
  </div>
  <p class="hint">滑动相邻格子交换 · 横竖 ≥3 同类消除</p>
</div>
<div class="overlay" id="overlay">
  <div class="card" id="card">
    <h2 id="otitle"></h2>
    <p id="omsg"></p>
    <button id="obtn" type="button">继续</button>
    <button class="ghost" id="oretry" type="button">重来本关</button>
  </div>
</div>
<script>
const TYPES = [
  {id:'mail', name:'邮件', icon:'assets/tile-email-128.png'},
  {id:'meet', name:'会议', icon:'assets/tile-meeting-128.png'},
  {id:'ot', name:'加班单', icon:'assets/tile-overtime-128.png'},
  {id:'ppt', name:'PPT', icon:'assets/tile-ppt-128.png'},
  {id:'ding', name:'钉钉', icon:'assets/tile-ding-128.png'},
];
const N = 8;
const SAVE_KEY = 'moyu-match3-v1';

function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}

function makeLevels(){
  const levels=[];
  for(let i=1;i<=30;i++){
    let moves=20, goal;
    if(i<=10){
      moves=20;
      if(i%2===1) goal={kind:'score', need:400+i*80};
      else { const t=TYPES[(i-1)%5].id; goal={kind:'clear', type:t, need:12+i}; }
    } else if(i<=20){
      moves=20;
      if(i%2===0) goal={kind:'score', need:900+(i-10)*100};
      else { const t=TYPES[i%5].id; goal={kind:'clear', type:t, need:18+(i-10)*2}; }
    } else {
      moves=15+(i%4===0?3:i%2);
      if(i%3===0) goal={kind:'score', need:1400+(i-20)*120};
      else if(i%3===1){ const t=TYPES[i%5].id; goal={kind:'clear', type:t, need:28+(i-20)*2}; }
      else { const t=TYPES[(i+2)%5].id; goal={kind:'dual', type:t, need:20, score:1200+(i-20)*80}; }
    }
    levels.push({id:i, moves, goal});
  }
  return levels;
}
const LEVELS = makeLevels();

const state = {
  levelIndex: 0,
  grid: [],
  selected: null,
  moves: 0,
  score: 0,
  cleared: {},
  busy: false,
  shuffleLeft: 1,
  clearRowLeft: 1,
  rowPickMode: false,
};

function loadProgress(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw) return 0;
    const d=JSON.parse(raw);
    return Math.max(0, Math.min(29, d.levelIndex|0));
  }catch(e){return 0}
}
function saveProgress(){
  localStorage.setItem(SAVE_KEY, JSON.stringify({levelIndex: state.levelIndex}));
}

function typeById(id){return TYPES.find(t=>t.id===id)}
function randType(rng){return TYPES[Math.floor(rng()*TYPES.length)].id}

function createGrid(seed){
  const rng=mulberry32(seed);
  const g=Array.from({length:N},()=>Array(N).fill(null));
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    let t,guard=0;
    do{ t=randType(rng); guard++; }while(guard<20 && wouldMatchAt(g,r,c,t));
    g[r][c]=t;
  }
  return g;
}
function wouldMatchAt(g,r,c,t){
  if(c>=2 && g[r][c-1]===t && g[r][c-2]===t) return true;
  if(r>=2 && g[r-1][c]===t && g[r-2][c]===t) return true;
  return false;
}

function findMatches(g){
  const mark=Array.from({length:N},()=>Array(N).fill(false));
  for(let r=0;r<N;r++){
    let c=0;
    while(c<N){
      let e=c;
      while(e<N && g[r][e]===g[r][c]) e++;
      if(e-c>=3 && g[r][c]) for(let k=c;k<e;k++) mark[r][k]=true;
      c=e;
    }
  }
  for(let c=0;c<N;c++){
    let r=0;
    while(r<N){
      let e=r;
      while(e<N && g[e][c]===g[r][c]) e++;
      if(e-r>=3 && g[r][c]) for(let k=r;k<e;k++) mark[k][c]=true;
      r=e;
    }
  }
  const cells=[];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++) if(mark[r][c]) cells.push({r,c,type:g[r][c]});
  return cells;
}

function adjacent(a,b){return Math.abs(a.r-b.r)+Math.abs(a.c-b.c)===1}

const boardEl=document.getElementById('board');
const fxEl=document.getElementById('fx');
const lvEl=document.getElementById('lv');
const movesEl=document.getElementById('moves');
const goalEl=document.getElementById('goal');
const btnShuffle=document.getElementById('btnShuffle');
const btnClearRow=document.getElementById('btnClearRow');
const overlay=document.getElementById('overlay');
const card=document.getElementById('card');
const otitle=document.getElementById('otitle');
const omsg=document.getElementById('omsg');
const obtn=document.getElementById('obtn');
const oretry=document.getElementById('oretry');

boardEl.addEventListener('pointermove', onPointerMove);
boardEl.addEventListener('pointerup', onPointerUp);
boardEl.addEventListener('pointercancel', onPointerUp);
boardEl.addEventListener('touchmove', onPointerMove, {passive:false});
boardEl.addEventListener('touchend', onPointerUp);
boardEl.addEventListener('touchcancel', onPointerUp);
document.addEventListener('pointerup', onPointerUp);

function cellEl(r,c){return boardEl.querySelector(`[data-r="${r}"][data-c="${c}"]`)}

function sparkAt(el, pts){
  const br=boardEl.getBoundingClientRect();
  const er=el.getBoundingClientRect();
  const cx=er.left-br.left+er.width/2;
  const cy=er.top-br.top+er.height/2;
  for(let i=0;i<pts;i++){
    const s=document.createElement('div');
    s.className='spark';
    const ang=Math.random()*Math.PI*2;
    const dist=18+Math.random()*28;
    s.style.left=cx+'px';
    s.style.top=cy+'px';
    s.style.setProperty('--dx', Math.cos(ang)*dist+'px');
    s.style.setProperty('--dy', Math.sin(ang)*dist+'px');
    s.style.background=['#f0c14b','#58a6ff','#f85149','#3fb950','#d2a8ff'][i%5];
    fxEl.appendChild(s);
    setTimeout(()=>s.remove(),420);
  }
}

function floatScore(el, text){
  const br=boardEl.getBoundingClientRect();
  const er=el.getBoundingClientRect();
  const f=document.createElement('div');
  f.className='float-score';
  f.textContent=text;
  f.style.left=(er.left-br.left+er.width/2)+'px';
  f.style.top=(er.top-br.top)+'px';
  fxEl.appendChild(f);
  setTimeout(()=>f.remove(),700);
}

function renderGoal(){
  const g=LEVELS[state.levelIndex].goal;
  const name=id=> (typeById(id)||{}).name||id;
  if(g.kind==='score') goalEl.textContent=`目标 ${state.score}/${g.need} 分`;
  else if(g.kind==='clear') goalEl.textContent=`消除 ${name(g.type)}  ${(state.cleared[g.type]|0)}/${g.need}`;
  else goalEl.textContent=`消除 ${name(g.type)} ${(state.cleared[g.type]|0)}/${g.need}　·　${state.score}/${g.score} 分`;
}

function renderHud(){
  lvEl.textContent=String(state.levelIndex+1);
  movesEl.textContent=String(state.moves);
  renderGoal();
  btnShuffle.disabled=state.busy||state.shuffleLeft<=0||state.rowPickMode;
  btnClearRow.disabled=state.busy||state.clearRowLeft<=0;
  btnShuffle.querySelector('em').textContent=`剩余 ${state.shuffleLeft}`;
  btnClearRow.querySelector('em').textContent=state.rowPickMode?'点一行':'剩余 '+state.clearRowLeft;
}

function renderBoard(opts){
  opts=opts||{};
  boardEl.innerHTML='';
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const tid=state.grid[r][c];
    const info=typeById(tid)||{name:'?',icon:''};
    const div=document.createElement('div');
    div.className='cell';
    div.dataset.r=r; div.dataset.c=c;
    div.title=info.name||'';
    if(info.icon){
      const img=document.createElement('img');
      img.src=info.icon;
      img.alt=info.name;
      div.appendChild(img);
    }
    if(state.selected && state.selected.r===r && state.selected.c===c) div.classList.add('selected');
    if(state.busy && !state.rowPickMode) div.classList.add('disabled');
    if(opts.spawn && opts.spawn.has(r+','+c)) div.classList.add('spawn');
    div.addEventListener('pointerdown', onPointerDown);
    div.addEventListener('touchstart', onPointerDown, {passive:false});
    boardEl.appendChild(div);
  }
  renderHud();
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms))}

async function resolveBoard(){
  let chain=0;
  while(true){
    const matches=findMatches(state.grid);
    if(!matches.length) break;
    chain++;
    const gained=matches.length*10*chain;
    for(const m of matches){
      state.cleared[m.type]=(state.cleared[m.type]|0)+1;
      state.score += 10 * chain;
    }
    // pop + sparks
    let mid=null;
    for(const m of matches){
      const el=cellEl(m.r,m.c);
      if(el){
        el.classList.add('popping');
        sparkAt(el, 5);
        if(!mid) mid=el;
      }
      state.grid[m.r][m.c]=null;
    }
    if(mid) floatScore(mid, '+'+gained);
    renderGoal();
    await sleep(320);

    // compute fall distances
    const fallFrom=Array.from({length:N},()=>Array(N).fill(0));
    const spawnSet=new Set();
    const next=Array.from({length:N},()=>Array(N).fill(null));
    for(let c=0;c<N;c++){
      const stack=[];
      for(let r=N-1;r>=0;r--){
        if(state.grid[r][c]!=null) stack.push({type:state.grid[r][c], from:r});
      }
      let write=N-1;
      for(const item of stack){
        next[write][c]=item.type;
        fallFrom[write][c]=item.from-write;
        write--;
      }
      for(let r=write;r>=0;r--){
        next[r][c]=randType(Math.random);
        spawnSet.add(r+','+c);
      }
    }
    state.grid=next;
    renderBoard({spawn:spawnSet});
    // animate fall with CSS transform then clear
    for(let r=0;r<N;r++)for(let c=0;c<N;c++){
      const d=fallFrom[r][c];
      if(d>0){
        const el=cellEl(r,c);
        if(el && el.firstChild){
          const cellH=el.getBoundingClientRect().height + 6;
          el.classList.add('falling');
          el.firstChild.style.transform=`translateY(${-d*cellH}px)`;
          requestAnimationFrame(()=>{
            requestAnimationFrame(()=>{
              if(el.firstChild) el.firstChild.style.transform='translateY(0)';
            });
          });
        }
      }
    }
    await sleep(260);
    renderBoard();
    await sleep(40);
  }
}

function goalMet(){
  const g=LEVELS[state.levelIndex].goal;
  if(g.kind==='score') return state.score>=g.need;
  if(g.kind==='clear') return (state.cleared[g.type]|0)>=g.need;
  return (state.cleared[g.type]|0)>=g.need && state.score>=g.score;
}

function showOverlay(win){
  overlay.classList.add('show');
  card.className='card '+(win?'win':'lose');
  if(win){
    otitle.textContent=state.levelIndex>=29?'摸鱼成功':'过关';
    omsg.textContent=state.levelIndex>=29?'30 关摸完了，下班吧。':'邮件会议先消一波，继续下一关。';
    obtn.textContent=state.levelIndex>=29?'再玩一遍':'下一关';
    oretry.style.display='none';
  }else{
    otitle.textContent='加班失败';
    omsg.textContent='步数用完了，重来一局继续摸。';
    obtn.textContent='重来本关';
    oretry.style.display='none';
  }
  obtn.onclick=()=>{
    overlay.classList.remove('show');
    if(win){
      if(state.levelIndex>=29){ state.levelIndex=0; saveProgress(); }
      else { state.levelIndex++; saveProgress(); }
    }
    startLevel();
  };
}

async function afterMove(){
  await resolveBoard();
  renderBoard();
  if(goalMet()){ state.busy=false; showOverlay(true); return; }
  if(state.moves<=0){ state.busy=false; showOverlay(false); return; }
  state.busy=false; renderBoard();
}

async function trySwap(a,b){
  if(!adjacent(a,b)) return false;
  state.busy=true;
  state.selected=null;
  renderBoard();
  const ea=cellEl(a.r,a.c), eb=cellEl(b.r,b.c);
  if(ea && eb){
    const ar=ea.getBoundingClientRect(), br=eb.getBoundingClientRect();
    const dx=br.left-ar.left, dy=br.top-ar.top;
    ea.classList.add('swap-a'); eb.classList.add('swap-b');
    if(ea.firstChild) ea.firstChild.style.transition='transform .18s ease';
    if(eb.firstChild) eb.firstChild.style.transition='transform .18s ease';
    if(ea.firstChild) ea.firstChild.style.transform=`translate(${dx}px,${dy}px)`;
    if(eb.firstChild) eb.firstChild.style.transform=`translate(${-dx}px,${-dy}px)`;
    await sleep(180);
  }
  const g=state.grid;
  const tmp=g[a.r][a.c]; g[a.r][a.c]=g[b.r][b.c]; g[b.r][b.c]=tmp;
  const matches=findMatches(g);
  if(!matches.length){
    // swap back visually
    if(ea && eb && ea.firstChild && eb.firstChild){
      ea.firstChild.style.transform='translate(0,0)';
      eb.firstChild.style.transform='translate(0,0)';
      await sleep(180);
    }
    const t2=g[a.r][a.c]; g[a.r][a.c]=g[b.r][b.c]; g[b.r][b.c]=t2;
    state.busy=false; renderBoard();
    return false;
  }
  state.moves--;
  renderBoard();
  await afterMove();
  return true;
}

const swipe={active:false,r:0,c:0,x:0,y:0,done:false};

function cellFromPoint(clientX, clientY){
  const el=document.elementFromPoint(clientX, clientY);
  if(!el) return null;
  const cell=el.closest ? el.closest('.cell') : null;
  if(!cell || !boardEl.contains(cell)) return null;
  return {r:+cell.dataset.r, c:+cell.dataset.c};
}

async function clearRowAt(r){
  state.rowPickMode=false;
  state.clearRowLeft--;
  state.busy=true;
  const rowEls=[];
  for(let col=0;col<N;col++){
    const t=state.grid[r][col];
    const el=cellEl(r,col);
    if(t && el){
      state.cleared[t]=(state.cleared[t]|0)+1;
      state.score+=10;
      el.classList.add('popping');
      sparkAt(el, 4);
      rowEls.push(el);
    }
    state.grid[r][col]=null;
  }
  if(rowEls[0]) floatScore(rowEls[Math.floor(rowEls.length/2)], '+'+rowEls.length*10);
  renderGoal();
  await sleep(320);
  for(let col=0;col<N;col++){
    let write=N-1;
    for(let row=N-1;row>=0;row--){
      if(state.grid[row][col]!=null){
        state.grid[write][col]=state.grid[row][col];
        if(write!==row) state.grid[row][col]=null;
        write--;
      }
    }
    for(let row=write;row>=0;row--) state.grid[row][col]=randType(Math.random);
  }
  renderBoard();
  await afterMove();
}

function onPointerDown(e){
  if(state.busy && !state.rowPickMode) return;
  const cell=e.currentTarget;
  const r=+cell.dataset.r, c=+cell.dataset.c;
  if(state.rowPickMode){ clearRowAt(r); return; }
  const pt=e.touches?e.touches[0]:e;
  swipe.active=true; swipe.done=false; swipe.r=r; swipe.c=c; swipe.x=pt.clientX; swipe.y=pt.clientY;
  state.selected={r,c}; renderBoard();
  e.preventDefault();
}

function onPointerMove(e){
  if(!swipe.active || swipe.done || state.busy) return;
  const pt=e.touches?e.touches[0]:e;
  const dx=pt.clientX-swipe.x, dy=pt.clientY-swipe.y;
  const absX=Math.abs(dx), absY=Math.abs(dy);
  const thresh=18;
  if(absX<thresh && absY<thresh) return;
  let tr=swipe.r, tc=swipe.c;
  if(absX>absY){ tc += dx>0?1:-1; }
  else { tr += dy>0?1:-1; }
  if(tr<0||tr>=N||tc<0||tc>=N){ swipe.active=false; state.selected=null; renderBoard(); return; }
  swipe.done=true; swipe.active=false;
  const a={r:swipe.r,c:swipe.c}, b={r:tr,c:tc};
  state.selected=null;
  trySwap(a,b);
  e.preventDefault();
}

function onPointerUp(){
  if(!swipe.active) return;
  swipe.active=false;
  // tap without swipe: keep brief highlight then clear
  if(!swipe.done){
    setTimeout(()=>{ if(!state.busy){ state.selected=null; renderBoard(); } }, 180);
  }
}

btnShuffle.onclick=async()=>{
  if(state.busy||state.shuffleLeft<=0) return;
  state.shuffleLeft--;
  state.busy=true;
  state.grid=createGrid(Date.now()%1e9);
  renderBoard();
  await resolveBoard();
  state.busy=false; renderBoard();
};

btnClearRow.onclick=()=>{
  if(state.busy||state.clearRowLeft<=0) return;
  state.rowPickMode=true;
  state.selected=null;
  renderHud();
};

function startLevel(){
  const lv=LEVELS[state.levelIndex];
  state.grid=createGrid(1000+state.levelIndex*97);
  state.selected=null;
  state.moves=lv.moves;
  state.score=0;
  state.cleared={};
  state.busy=false;
  state.shuffleLeft=1;
  state.clearRowLeft=1;
  state.rowPickMode=false;
  (async()=>{
    state.busy=true; renderBoard();
    await resolveBoard();
    state.score=0; state.cleared={};
    state.busy=false; renderBoard();
  })();
}

oretry.onclick=()=>{ overlay.classList.remove('show'); startLevel(); };

state.levelIndex=loadProgress();
startLevel();
</script>
</body>
</html>
